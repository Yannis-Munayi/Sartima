<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // Must match AppContext's default ('light') or first-time visitors
        // see a dark flash before React mounts.
        var t = localStorage.getItem('sartima_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('sartima_adaptive_theme') !== 'false') {
          var f = localStorage.getItem('sartima_aesthetic_flavor');
          if (f) document.documentElement.setAttribute('data-aesthetic', f);
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sartima — Find your aesthetic, style your closet</title>
    <meta name="description" content="Take a swipe quiz across 51 aesthetics, get AI outfits built from the clothes you already own, and see which pieces are worth buying next." />
    <link rel="canonical" href="https://sartima.ca/" />
    <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0A08" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sartima" />
    <meta property="og:url" content="https://sartima.ca/" />
    <meta property="og:title" content="Sartima — Find your aesthetic, style your closet" />
    <meta property="og:description" content="A swipe quiz across 51 aesthetics, AI outfits from the clothes you own, and the pieces worth buying next." />
    <meta property="og:image" content="https://sartima.ca/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sartima logo beside the line: Find your aesthetic. Style your closet." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sartima — Find your aesthetic, style your closet" />
    <meta name="twitter:description" content="A swipe quiz across 51 aesthetics, AI outfits from the clothes you own, and the pieces worth buying next." />
    <meta name="twitter:image" content="https://sartima.ca/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: a render-blocking font stylesheet held back first paint by
         seconds on slow mobile connections (display=swap covers the swap-in). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- Boot screen shown until React mounts (it replaces #root's children). Inline
         and hardcoded because no app CSS has loaded yet; colours mirror the
         --bg / --accent tokens for each theme. -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #F7F4EE; }
      .boot-mark { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 22px; letter-spacing: 0.32em; padding-left: 0.32em; color: #1A1612; }
      .boot-bar { width: 96px; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(139, 104, 64, 0.18); }
      .boot-bar::after { content: ''; display: block; width: 40%; height: 100%; background: #8B6840; animation: boot-slide 1.1s ease-in-out infinite; }
      [data-theme="dark"] .boot { background: #0C0A08; }
      [data-theme="dark"] .boot-mark { color: #F2EDE4; }
      [data-theme="dark"] .boot-bar { background: rgba(184, 149, 106, 0.2); }
      [data-theme="dark"] .boot-bar::after { background: #B8956A; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { animation: none; width: 100%; opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Sartima">
        <div class="boot-mark">SARTIMA</div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
