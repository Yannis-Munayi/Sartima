name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Placeholder Firebase config for the jobs that build or serve the app. The
# smoke tests stub every Cloud Function and never sign in, so they need no real
# project, and CI needs no secrets. (Stock photos fail to load; that's expected.)
env:
  VITE_FIREBASE_API_KEY: ci-placeholder
  VITE_FIREBASE_AUTH_DOMAIN: demo-sartima.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: demo-sartima
  VITE_FIREBASE_STORAGE_BUCKET: demo-sartima.appspot.com
  VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
  VITE_FIREBASE_APP_ID: '1:0:web:0'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint catalog
        run: npm run lint:catalog

      # Reported, not enforced: app code still has lint errors from before this
      # step existed. Remove continue-on-error once `npm run lint` is clean.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      # Warn (don't fail) if data-flow code changed without a legal-version bump.
      # New external services in functions/ must be reflected in the Privacy Policy.
      - name: Legal version check
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE"...HEAD | grep -q "^functions/index.js"; then
            if git diff "$BASE"...HEAD -- src/data/legalContent.js | grep -q "LEGAL_VERSION"; then
              echo "functions/index.js changed and LEGAL_VERSION was bumped — OK"
            else
              echo "::warning file=src/data/legalContent.js::functions/index.js changed without a LEGAL_VERSION bump. If this change adds/alters an external data flow (new API, new provider), update the Privacy Policy and bump LEGAL_VERSION."
            fi
          fi

  unit:
    name: Unit + Functions tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Run tests
        run: npm test

  rules:
    name: Security rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore and Storage emulators need Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm ci
          npm install -g firebase-tools@15.19.1

      - name: Run rules tests against the emulators
        run: npm run test:rules

  e2e:
    name: Smoke tests (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e

      - name: Upload traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
